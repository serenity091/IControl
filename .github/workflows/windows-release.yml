name: Build Windows companion
on:
  push:
    branches: [codex/native-ios-motion]
    paths:
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VGAMEPAD_SKIP_VIGEMBUS_INSTALL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python scripts/install_windows_dependencies.py --build
      - name: Build standalone Windows executable
        run: python build_exe.py
      - name: Package companion and Wi-Fi helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item 'dist/Phone Controller.exe','Enable Wi-Fi access.cmd','enable-wifi.ps1' package/
          @'
          Phone Controller for Windows — release candidate
          Extract all files, install ViGEmBus, and run Phone Controller.exe.
          Setup and support: https://serenity091.github.io/IControl/support/
          Privacy: https://serenity091.github.io/IControl/privacy/
          ViGEmBus: https://github.com/nefarius/ViGEmBus/releases
          This build was packaged on GitHub Actions. No gameplay tests ran in CI.
          '@ | Set-Content package/README.txt
          Compress-Archive -Path package/* -DestinationPath Phone-Controller-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Phone-Controller-Windows
          path: Phone-Controller-Windows.zip
          retention-days: 30
          if-no-files-found: error
